name: Check & deploy to Beget

# All logic lives in scripts/ci.sh, scripts/deploy.sh, scripts/report.sh.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: https://loykiawbqdkitndqkegk.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GjGkSeQ5okx58Tphh7Hfrw_6psgCioE
  SITE_URL: https://mylinks.bar
  DEPLOY_LOG_ISSUE: 5
  IS_PR: ${{ github.event_name == 'pull_request' }}

jobs:
  registration_db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test registration migration
        env:
          PGPASSWORD: postgres
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-registration-migration.sql

  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check, build and deploy
        env:
          BEGET_FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
          BEGET_FTP_USER: ${{ secrets.BEGET_FTP_USER }}
          BEGET_FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
          BEGET_FTP_DIR: ${{ secrets.BEGET_FTP_DIR }}
        run: bash scripts/ci.sh
      - name: Report the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/report.sh
