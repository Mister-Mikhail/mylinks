name: Feature branch checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest version of a PR needs the full suite.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://loykiawbqdkitndqkegk.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GjGkSeQ5okx58Tphh7Hfrw_6psgCioE
  SITE_URL: https://mylinks.bar
  CI_SUITE: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review') && 'full' || 'quick' }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CI_DEPS_INSTALLED: 'true'

jobs:
  registration_db:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test registration and appearance migrations
        env:
          PGPASSWORD: postgres
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-registration-migration.sql
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, dom, xml
          coverage: none
      - name: Cache Chromium matching the dependency lockfile
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Cache official Yandex package
        if: env.CI_SUITE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mylinks-yandex
          key: yandex-${{ runner.os }}-${{ hashFiles('scripts/test-yandex.sh') }}
      # Runner images already ship Chromium's system libraries; skipping apt keeps
      # this step under a minute. A bounded install-deps runs only if launch fails.
      - name: Install Chromium for Playwright
        timeout-minutes: 8
        run: |
          npx playwright install chromium
          node -e "require('@playwright/test').chromium.launch().then(b=>b.close())" \
            || timeout 300 npx playwright install-deps chromium
      - name: Restore full-suite server packages
        if: env.CI_SUITE == 'full'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mylinks-apt
          key: apt-${{ runner.os }}-apache2-bin-php-cgi-ffmpeg-librsvg-v1
      - name: Install full-suite server tools
        id: server_tools
        if: env.CI_SUITE == 'full'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          exec > >(tee -a ci.log) 2>&1
          log() { echo "[$(date -u +%H:%M:%S)] $*"; }
          # Background apt jobs on fresh runners hold the dpkg lock for minutes,
          # and man-db reindexes after every package. Neither is needed here.
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          # The Azure mirror sometimes trickles at a few kB/s; list the main archive
          # first so a stalled mirror no longer decides the outcome.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt.new >/dev/null
            grep -v '^http://archive.ubuntu.com' /etc/apt/apt-mirrors.txt | sudo tee -a /etc/apt/apt-mirrors.txt.new >/dev/null
            sudo mv /etc/apt/apt-mirrors.txt.new /etc/apt/apt-mirrors.txt
          fi
          pkgs="apache2-bin php-cgi ffmpeg librsvg2-2"
          cache=~/.cache/mylinks-apt; mkdir -p "$cache"
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::http::Low-Speed-Limit=20000 -o Acquire::http::Low-Speed-Time=15 -o DPkg::Lock::Timeout=120 -o Dpkg::Use-Pty=0"
          if ls "$cache"/*.deb >/dev/null 2>&1; then
            log "installing from cached packages"
            sudo cp "$cache"/*.deb /var/cache/apt/archives/
          fi
          for attempt in 1 2; do
            log "apt update (attempt $attempt)"
            sudo timeout 180 apt-get $opts update -qq || { log "update failed"; continue; }
            log "apt install (attempt $attempt)"
            if sudo timeout 420 apt-get $opts install -y --no-install-recommends $pkgs | grep -E '^(Get|Unpacking|Setting up|E:|W:)' || false; then
              cp /var/cache/apt/archives/*.deb "$cache"/ 2>/dev/null || true
              log "installed"; exit 0
            fi
            log "install attempt $attempt failed"
          done
          exit 1
      - name: Save full-suite server packages
        if: always() && steps.server_tools.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mylinks-apt
          key: apt-${{ runner.os }}-apache2-bin-php-cgi-ffmpeg-librsvg-v1
      - uses: denoland/setup-deno@v2
        if: env.CI_SUITE == 'full'
        with:
          deno-version: v2.x
      - if: env.CI_SUITE == 'full'
        run: bash scripts/test-edge.sh
      - name: Lint, build, PHP, unit and selected browser suite
        run: bash scripts/ci.sh
      # Raw job logs live in blob storage that reviewers' tools often cannot reach;
      # annotations are readable through the regular checks API and the PR page.
      - name: Publish the end of the log as an annotation
        if: failure()
        run: |
          test -f ci.log || exit 0
          # Strip colours and progress bars, keep the last 200 lines in 50-line annotations
          # (one long annotation is truncated on the checks page and in the API).
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r/\n/g' ci.log | grep -v -E '^ *[0-9]+ +[0-9.]+[kMG]? +[0-9]+ ' | cut -c1-400 | tail -n 200 > ci-tail.txt
          split -l 50 -d ci-tail.txt ci-tail-part-
          for part in ci-tail-part-*; do
            body=$(sed -e 's/%/%25/g' "$part" | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=ci.sh log ($part)::${body}"
          done
      - name: Preserve desktop and mobile appearance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-visual-matrix
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 2
