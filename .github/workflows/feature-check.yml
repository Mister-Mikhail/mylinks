name: Feature branch checks
on:
  push:
    branches: ['feature/**']

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://loykiawbqdkitndqkegk.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GjGkSeQ5okx58Tphh7Hfrw_6psgCioE
  SITE_URL: https://mylinks.bar
  IS_PR: 'true'

jobs:
  registration_db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test registration and appearance migrations
        env:
          PGPASSWORD: postgres
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-registration-migration.sql
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto supabase/functions/favicon/index.ts
      - name: Lint, build, PHP and desktop/mobile e2e
        run: bash scripts/ci.sh
      - name: Preserve desktop and mobile appearance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-visual-matrix
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
