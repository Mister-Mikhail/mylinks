name: Feature branch checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest version of a PR needs the full suite.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://loykiawbqdkitndqkegk.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GjGkSeQ5okx58Tphh7Hfrw_6psgCioE
  SITE_URL: https://mylinks.bar
  CI_SUITE: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review') && 'full' || 'quick' }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CI_DEPS_INSTALLED: 'true'

jobs:
  registration_db:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test registration and appearance migrations
        env:
          PGPASSWORD: postgres
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-registration-migration.sql
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, dom, xml
          coverage: none
      - name: Cache Chromium matching the dependency lockfile
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Cache official Yandex package
        if: env.CI_SUITE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mylinks-yandex
          key: yandex-${{ runner.os }}-${{ hashFiles('scripts/test-yandex.sh') }}
      - run: npx playwright install --with-deps chromium
      - name: Install full-suite server tools
        if: env.CI_SUITE == 'full'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apache2-bin php-cgi ffmpeg
      - uses: denoland/setup-deno@v2
        if: env.CI_SUITE == 'full'
        with:
          deno-version: v2.x
      - if: env.CI_SUITE == 'full'
        run: deno test --node-modules-dir=auto supabase/functions/_shared/
      - if: env.CI_SUITE == 'full'
        run: deno check --node-modules-dir=auto supabase/functions/admin-profile/index.ts
      - if: env.CI_SUITE == 'full'
        run: deno check --node-modules-dir=auto supabase/functions/favicon/index.ts
      - name: Lint, build, PHP, unit and selected browser suite
        run: bash scripts/ci.sh
      - name: Preserve desktop and mobile appearance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-visual-matrix
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 2
