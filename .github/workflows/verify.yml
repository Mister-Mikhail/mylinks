name: Verify mylinks

on:
  push:
    branches: [perf/fast-public-profile]
  pull_request:
    branches: [codex/mobile-appearance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://loykiawbqdkitndqkegk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: verification-only-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - name: Reuse the current live public client settings
        run: python3 .github/scripts/read-live-client-config.py
      - name: Build the deployment artifact
        run: npm run build
      - name: Package the verified build and offline dependencies
        run: |
          tar -czf verified-deployment.tar.gz .openai/hosting.json dist .env.local
          tar -czf verified-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: verified-deployment
          path: verified-deployment.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-node-modules
          path: verified-node-modules.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            test-results/
            playwright-report/
