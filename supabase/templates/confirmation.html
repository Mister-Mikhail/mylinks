<!doctype html>
<html lang="ru">
  <body style="margin:0;background:#f3f6fa;font-family:Arial,Helvetica,sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f6fa;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:20px">
          <tr><td style="padding:30px 32px 12px">
            <table role="presentation" cellspacing="0" cellpadding="0">
              <tr>
                <td style="padding-right:12px;vertical-align:middle">
                  <img src="https://mylinks.bar/email-brand-mark.png" width="58" height="42" alt="mylinks.bar" style="display:block;border:0;width:58px;height:42px" />
                </td>
                <td style="font-size:25px;font-weight:700;letter-spacing:-1px;color:#172033">mylinks<span style="color:#2495ed">.bar</span></td>
              </tr>
            </table>
          </td></tr>
          <tr><td style="padding:14px 32px 32px">
            <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;color:#172033">Подтвердите email</h1>
            <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#586579">Откройте страницу подтверждения и нажмите кнопку, чтобы завершить создание аккаунта.</p>
            <a href="https://mylinks.bar/auth/confirmed#token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 22px;border-radius:12px;background:#178be0;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700">Подтвердить email</a>
            <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8590a0">Если вы не создавали страницу на mylinks.bar, просто проигнорируйте это письмо.</p>
            <p style="margin:24px 0 0;font-size:13px;color:#8590a0">mylinks.bar · Все ссылки в одном месте</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
